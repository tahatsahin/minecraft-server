services:
  mc:
    image: itzg/minecraft-server
    container_name: minecraft

    ports:
      - "25565:25565"

    environment:
      EULA: "TRUE"
      TYPE: VANILLA
      VERSION: LATEST
      MEMORY: "2500M"
      ENABLE_ROLLING_LOGS: "true"

    volumes:
      - ./data:/data

    restart: unless-stopped
